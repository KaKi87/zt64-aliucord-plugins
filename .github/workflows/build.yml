name: "Build"

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - dev
    paths:
      - ".github/workflows/**"
      - "gradle.properties"
      - "gradle/**"
      - "plugin/**"
      - "**.gradle.kts"

jobs:
  build:
    name: Build Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build plugins
        run: |
          chmod +x ./gradlew
          ./gradlew make

      - name: Upload plugin artifacts
        run: |
          npm install --no-save @actions/artifact@2
          node <<'NODE'
          const fs = require('fs');
          const path = require('path');
          const { DefaultArtifactClient } = require('@actions/artifact');

          const client = new DefaultArtifactClient();
          const plugins = fs.readdirSync('plugin', { withFileTypes: true })
            .filter((entry) => entry.isDirectory())
            .map((entry) => entry.name);

          if (plugins.length === 0) {
            console.error('No plugins found');
            process.exit(1);
          }

          (async () => {
            for (const plugin of plugins) {
              const zip = path.join('plugin', plugin, 'build', 'outputs', `${plugin}.zip`);
              if (!fs.existsSync(zip)) {
                throw new Error(`Missing build output: ${zip}`);
              }

              console.log(`Uploading ${plugin}`);
              const { id, size } = await client.uploadArtifact(plugin, [zip], process.cwd());
              console.log(`Uploaded ${plugin} (id: ${id}, bytes: ${size})`);
            }
          })().catch((error) => {
            console.error(error);
            process.exit(1);
          });
          NODE
