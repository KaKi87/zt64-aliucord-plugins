name: "Build"

concurrency:
  group: "build-${{ github.ref }}"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches-ignore:
      - main
      - dev
    paths:
      - ".github/workflows/**"
      - "gradle.properties"
      - "gradle/**"
      - "plugin/**"
      - "**.gradle.kts"

jobs:
  setup:
    runs-on: ubuntu-latest
    outputs:
      plugins: ${{ steps.plugins.outputs.list }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: List plugins
        id: plugins
        run: |
          list=$(find plugin -mindepth 1 -maxdepth 1 -type d -exec basename {} \; | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "list=$list" >> "$GITHUB_OUTPUT"

  build:
    name: Build ${{ matrix.plugin }}
    needs: setup
    runs-on: ubuntu-latest
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        plugin: ${{ fromJson(needs.setup.outputs.plugins) }}
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build plugin
        run: |
          chmod +x ./gradlew
          ./gradlew ":plugin:${{ matrix.plugin }}:make"

      - name: Upload plugin artifact
        uses: actions/upload-artifact@v7
        with:
          name: ${{ matrix.plugin }}
          if-no-files-found: error
          path: plugin/${{ matrix.plugin }}/build/outputs/${{ matrix.plugin }}.zip
