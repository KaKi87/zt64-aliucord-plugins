name: "Deploy Dev"

concurrency:
  group: "deploy-dev"
  cancel-in-progress: true

on:
  workflow_dispatch:
  push:
    branches:
      - dev
    paths:
      - ".github/workflows/**"
      - "gradle.properties"
      - "gradle/**"
      - "plugin/**"
      - "**.gradle.kts"

permissions:
  contents: write

jobs:
  deploy-dev:
    name: Build & Deploy Dev Plugins
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          path: "src"

      - name: Checkout dev-builds
        uses: actions/checkout@v6
        with:
          ref: "dev-builds"
          path: "dev-builds"

      - name: Setup JDK 21
        uses: actions/setup-java@v5
        with:
          java-version: 21
          distribution: temurin

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v5
        with:
          cache-encryption-key: ${{ secrets.GRADLE_ENCRYPTION_KEY }}

      - name: Build plugins
        run: |
          cd "$GITHUB_WORKSPACE/src"
          chmod +x ./gradlew
          ./gradlew make generateUpdaterJson
          rm -f "$GITHUB_WORKSPACE/dev-builds"/*.zip
          cp plugin/*/build/outputs/*.zip "$GITHUB_WORKSPACE/dev-builds"
          cp build/outputs/updater.json "$GITHUB_WORKSPACE/dev-builds"
          sed -i 's|/builds/|/dev-builds/|g' "$GITHUB_WORKSPACE/dev-builds/updater.json"

      - name: Upload plugin artifacts
        uses: actions/upload-artifact@v7
        with:
          name: plugins-dev-${{ github.run_number }}
          if-no-files-found: error
          path: ${{ github.workspace }}/src/plugin/*/build/outputs/*.zip

      - name: Push dev-builds
        run: |
          cd "$GITHUB_WORKSPACE/dev-builds"
          git config --local user.email "actions@github.com"
          git config --local user.name "GitHub Actions"
          git add .
          git commit -m "Build $GITHUB_SHA" || exit 0
          git push

      - name: Publish prerelease
        uses: softprops/action-gh-release@v2
        with:
          tag_name: dev
          name: Dev prerelease (${{ github.sha }})
          prerelease: true
          make_latest: false
          generate_release_notes: true
          files: |
            ${{ github.workspace }}/dev-builds/*.zip
            ${{ github.workspace }}/dev-builds/updater.json
